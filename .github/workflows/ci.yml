name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Installer smoke test
        run: |
          FLUTTERDB_HOME="$RUNNER_TEMP/fdb" FLUTTERDB_BIN="$RUNNER_TEMP/bin" sh install.sh --local
          "$RUNNER_TEMP/bin/flutterdb" --version
          "$RUNNER_TEMP/bin/flutterdb" --demo --once

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh examples/checkLiveDb.sh
